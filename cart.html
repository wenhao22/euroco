<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Euroco Cart</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: #2f2a25;
      background: #fffaf2;
      line-height: 1.6;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 24px;
      background: rgba(255, 250, 242, 0.94);
      border-bottom: 1px solid #eadfce;
      backdrop-filter: blur(10px);
    }

    .logo,
    .nav-links a {
      color: #8f3f35;
      text-decoration: none;
    }

    .logo {
      font-size: 24px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 64px 24px;
    }

    h1,
    h2 {
      margin: 0 0 12px;
      color: #315c45;
      font-weight: 400;
    }

    h1 {
      font-size: 44px;
    }

    .section-intro {
      margin: 0 0 30px;
      color: #62584f;
    }

    .button {
      display: inline-block;
      padding: 12px 24px;
      border: 0;
      border-radius: 999px;
      background: #8f3f35;
      color: #fffaf2;
      cursor: pointer;
      font: inherit;
      text-decoration: none;
    }

    .button.secondary {
      background: transparent;
      color: #8f3f35;
      border: 1px solid #8f3f35;
    }

    .cart {
      padding: 34px;
      background: #ffffff;
      border: 1px solid #eadfce;
      border-radius: 8px;
    }

    .cart-list {
      display: grid;
      gap: 14px;
      margin-bottom: 20px;
    }

    .cart-empty {
      margin: 0 0 20px;
      color: #62584f;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: start;
      padding: 18px;
      background: #fffaf2;
      border: 1px solid #eadfce;
      border-radius: 8px;
    }

    .cart-item h3 {
      margin: 0 0 8px;
      color: #315c45;
      font-size: 20px;
      font-weight: 400;
    }

    .cart-item p {
      margin: 0;
      color: #62584f;
      white-space: pre-line;
    }

    .cart-total {
      margin: 0 0 18px;
      color: #315c45;
      font-size: 24px;
    }

    .cart-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .remove-button {
      padding: 9px 14px;
      border: 1px solid #8f3f35;
      border-radius: 999px;
      background: transparent;
      color: #8f3f35;
      cursor: pointer;
      font-family: inherit;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(47, 42, 37, 0.55);
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      width: min(620px, 100%);
      max-height: 92vh;
      overflow: auto;
      padding: 30px;
      background: #fffaf2;
      border: 1px solid #eadfce;
      border-radius: 8px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: start;
      margin-bottom: 18px;
    }

    .close-modal {
      width: 40px;
      height: 40px;
      border: 1px solid #eadfce;
      border-radius: 50%;
      background: #ffffff;
      color: #4f463d;
      cursor: pointer;
      font-size: 24px;
      line-height: 1;
    }

    .order-form {
      display: grid;
      gap: 16px;
    }

    .form-field {
      display: grid;
      gap: 6px;
    }

    .form-field label {
      color: #315c45;
    }

    .form-field input,
    .form-field textarea {
      width: 100%;
      border: 1px solid #eadfce;
      border-radius: 8px;
      padding: 12px 14px;
      background: #ffffff;
      color: #2f2a25;
      font: inherit;
    }

    .form-field textarea {
      min-height: 96px;
      resize: vertical;
    }

    .modal-summary {
      padding: 16px;
      background: #ffffff;
      border: 1px solid #eadfce;
      border-radius: 8px;
      color: #62584f;
      white-space: pre-line;
    }

    .form-message {
      margin: 0;
      color: #315c45;
    }

    footer {
      padding: 26px;
      text-align: center;
      color: #7a6d60;
      font-size: 14px;
      border-top: 1px solid #eadfce;
    }

    @media (max-width: 700px) {
      nav {
        align-items: flex-start;
        flex-direction: column;
      }

      .cart-item {
        grid-template-columns: 1fr;
      }

      main {
        padding: 48px 18px;
      }
    }
  </style>
</head>

<body>
  <nav>
    <a class="logo" href="index.html">Euroco</a>

    <div class="nav-links">
      <a href="index.html#calculator">Continue Customising</a>
    </div>
  </nav>

  <main>
    <h1>Your Cart</h1>
    <p class="section-intro">
      Review your bouquet selections before confirming your order details.
    </p>

    <div class="cart">
      <div class="cart-list" id="cartList"></div>
      <p class="cart-empty" id="cartEmpty">Your cart is empty.</p>
      <p class="cart-total" id="cartTotal">Cart total: $0</p>

      <div class="cart-actions">
        <button class="button" type="button" id="confirmCart">Confirm Order</button>
        <button class="button secondary" type="button" id="clearCart">Clear Cart</button>
      </div>
    </div>
  </main>

  <div class="modal" id="orderModal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="orderModalTitle">
      <div class="modal-header">
        <h2 id="orderModalTitle">Confirm Your Order</h2>
        <button class="close-modal" type="button" id="closeOrderModal" aria-label="Close order form">&times;</button>
      </div>

      <form class="order-form" id="orderForm">
        <div class="modal-summary" id="orderSummary"></div>

        <div class="form-field">
          <label for="customerName">Name</label>
          <input id="customerName" name="customerName" type="text" required>
        </div>

        <div class="form-field">
          <label for="contactDetails">Contact Details</label>
          <input id="contactDetails" name="contactDetails" type="text" placeholder="Phone number, Telegram, or Instagram handle" required>
        </div>

        <div class="form-field">
          <label for="collectionDate">Preferred Date of Collection / Delivery</label>
          <input id="collectionDate" name="collectionDate" type="date" required>
        </div>

        <div class="form-field">
          <label for="occasion">Occasion (optional)</label>
          <textarea id="occasion" name="occasion" placeholder="Birthday, anniversary, graduation, or any notes for the bouquet"></textarea>
        </div>

        <button class="button" type="submit">Export Order Details</button>
        <p class="form-message" id="formMessage"></p>
      </form>
    </div>
  </div>

  <footer>
    <p>Euroco &copy; 2026 | Handcrafted pipe cleaner flowers</p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="cart.js"></script>
</body>
</html>
